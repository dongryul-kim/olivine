{%- if current %}
{%- set split = current.content | split(pat=config.base_url) %}
{%- set forward = split[1:] %}
{%- if forward %}
<div id="olivine-forward-links">
<h3>Forward links</h3>
<ul id="olivine-forward-link-lists">
</ul>
</div>
<script>
forward_list = [
{% for item in forward %}{% set path = item | split(pat='"') | first %} "{{ path | safe }}", {% endfor %}
];
hydrateForward("olivine-forward-link-lists", forward_list,
"{{ config.base_url | safe }}/olivine-internal-sitemap/");
</script>
{%- endif %}
{%- endif %}
