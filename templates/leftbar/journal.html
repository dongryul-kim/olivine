{% if config.extra.olivine.journal | default(value=true) %}
<ul>
  <li><a id="olivine-today">{{<olivine.icon name="calendar-check"/>}} Today</a></li>
  <li><a id="olivine-yesterday">{{<olivine.icon name="calendar-minus"/>}} Yesterday</a></li>
  <li><a id="olivine-calendar" href="{{ get_url(path="journal") }}">{{<olivine.icon name="calendar-days"/>}} All entries</a></li>
  <script>setJournal();</script>
</ul>
{% endif %}
